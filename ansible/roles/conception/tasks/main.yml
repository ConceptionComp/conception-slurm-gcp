# - name: Include OS Vars
#   include_vars: '{{ansible_os_family|lower}}-{{ansible_distribution_major_version}}.yml'

- name: Include OS Vars
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
  - '{{ ansible_distribution|lower }}-{{ ansible_distribution_version }}.yml'
  - '{{ ansible_distribution|lower }}-{{ ansible_distribution_major_version }}.yml'
  - '{{ ansible_distribution|lower }}.yml'
  - '{{ ansible_os_family|lower }}-{{ ansible_distribution_version }}.yml'
  - '{{ ansible_os_family|lower }}-{{ ansible_distribution_major_version }}.yml'
  - '{{ ansible_os_family|lower }}.yml'

- name: Install Packages
  apt:
    name: '{{common_packages}}'
    state: present
    install_recommends: no

- name: Install x86_64-only Packages
  apt:
    name: '{{common_packages_x86_only}}'
    state: present
    install_recommends: no
  when:
    - ansible_architecture == "x86_64"
    - common_packages_x86_only is defined

- name: Add apptainer PPA
  apt_repository:
    repo: "ppa:apptainer/ppa"
    state: present
    update_cache: yes
  register: _ppa_result
  retries: 3
  delay: 15
  until: _ppa_result is succeeded

- name: Install container and GPU-conditional tooling
  apt:
    name:
      - squashfuse
      - fuse3
      - e2fsprogs
      - gocryptfs
      - apptainer
    state: present
    update_cache: no

- name: Copy Pip Requirements File
  copy:
    src: '{{ item | basename }}'
    dest: /tmp/{{ item | basename }}
  with_first_found:
  - '{{ ansible_distribution|lower }}-{{ ansible_distribution_version }}_requirements.txt'
  - '{{ ansible_distribution|lower }}-{{ ansible_distribution_major_version }}_requirements.txt'
  - '{{ ansible_distribution|lower }}_requirements.txt'
  - '{{ ansible_os_family|lower }}-{{ ansible_distribution_version }}_requirements.txt'
  - '{{ ansible_os_family|lower }}-{{ ansible_distribution_major_version }}_requirements.txt'
  - '{{ ansible_os_family|lower }}_requirements.txt'
  register: requirements_file

- name: Install Pip Packages
  pip:
    requirements: '{{ requirements_file.results[0].dest }}'
    extra_args: --upgrade
    executable: pip3
    state: present
  async: 3600
  poll: 30

- name: Copy Cuda Pip Requirements File
  copy:
    src: '{{ item | basename }}'
    dest: /tmp/{{ item | basename }}
  with_first_found:
  - '{{ ansible_distribution|lower }}-{{ ansible_distribution_version }}_requirements_cuda.txt'
  - '{{ ansible_distribution|lower }}-{{ ansible_distribution_major_version }}_requirements_cuda.txt'
  - '{{ ansible_distribution|lower }}_requirements_cuda.txt'
  - '{{ ansible_os_family|lower }}-{{ ansible_distribution_version }}_requirements_cuda.txt'
  - '{{ ansible_os_family|lower }}-{{ ansible_distribution_major_version }}_requirements_cuda.txt'
  - '{{ ansible_os_family|lower }}_requirements_cuda.txt'
  register: cuda_requirements_file

- name: Make sure venv dir exists
  file:
    path: /opt/venv
    recurse: true
    state: directory

- name: Create and Install cuda venv
  pip:
     requirements: '{{ cuda_requirements_file.results[0].dest }}'
     virtualenv: /opt/venv/cuda-venv
     virtualenv_command: /usr/bin/python3.10 -m venv
  async: 3600
  poll: 30

- name: Install Module apps
  include_tasks: modules.yml
  loop: "{{ apps }}"
  when: item.arches is not defined or ansible_architecture in item.arches

- name: Set default modules
  template:
    src: StdEnv.lua.j2
    dest: '{{paths.modulefiles}}/StdEnv.lua'

- name: Create Default profile
  copy:
    src: 'z01_StdEnv.sh'
    dest: '/etc/profile.d/z01_StdEnv.sh'